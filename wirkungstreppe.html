<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wirkungstreppe (Entwurf)</title>
<link rel="stylesheet" href="gemeinsam.css">
<style>

  body { line-height: 1.5; font-size: 17px; }
  .blatt { max-width: 1400px; }
  button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blau); outline-offset: 3px; border-radius: 6px; }
  header.top { gap: 10px 14px; flex-wrap: wrap; }
  .brand { text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .brand svg { width: 18px; height: 18px; }

  .schritte { display: flex; flex-wrap: wrap; gap: 6px 22px; list-style: none; margin-top: 18px; font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--fg-muted); }
  .schritte button { font-weight: 600; color: var(--fg-muted); padding-bottom: 3px; }
  .schritte button:hover { color: var(--blau); }
  .schritte [aria-current] { color: var(--blau); font-weight: 700; box-shadow: inset 0 -3px 0 var(--minze); }

  .kopf { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 40px; flex-wrap: wrap; padding-top: 22px; }
  h1 { font-family: var(--display); font-weight: 700; color: var(--blau); letter-spacing: -0.02em; line-height: 1.1; font-size: clamp(26px, 2.4vw, 32px); text-wrap: balance; }
  .unter { font-size: 16px; color: var(--fg-2); margin-top: 6px; max-width: 46em; }
  .rand { display: flex; align-items: baseline; gap: 22px; font-size: 13.5px; color: var(--fg-muted); }
  .rand b { font-weight: 600; }
  .schalter { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--fg-muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: var(--blau-20); }
  .schalter:hover { color: var(--blau); }

  .zaehler { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--fg-muted); margin-bottom: 10px; }
  .sammeln { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 290px); gap: 32px clamp(40px, 6vw, 96px); align-items: start; padding-top: clamp(22px, 3vw, 36px); min-height: 430px; }
  .sammeln h1 { font-size: clamp(30px, 3.2vw, 42px); }
  .sammeln .unter { font-family: var(--display); font-weight: 300; font-size: clamp(18px, 1.7vw, 21px); line-height: 1.45; color: var(--fg); margin-top: 12px; }
  .vorschau { list-style: none; margin-top: 18px; display: grid; gap: 4px; max-width: 560px; font-size: 15.5px; color: var(--fg-2); }
  .vorschau b { font-family: var(--display); font-weight: 700; color: var(--fg-muted); margin-right: 8px; }
  .felder { display: grid; gap: 18px; margin-top: 28px; max-width: 560px; }
  .feld label { display: block; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--fg); }
  .feld .hilfe { display: block; font-size: 14.5px; color: var(--fg-muted); font-weight: 400; margin-top: 1px; }
  input[type=text], textarea { width: 100%; margin-top: 8px; background: var(--weiss); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 16px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--fg); transition: border-color .2s var(--ease); }
  textarea { font-weight: 400; line-height: 1.5; resize: vertical; min-height: 120px; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--blau-40); font-weight: 400; }
  input[type=text]:hover, textarea:hover { border-color: var(--blau-40); }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px var(--blau-10); }
  .eingabe { display: flex; gap: 10px; margin-top: 28px; max-width: 620px; }
  .eingabe input { margin-top: 0; }
  .neben { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--blau); color: var(--blau); border-radius: 999px; padding: 0 18px; font-family: var(--display); font-weight: 700; font-size: 15px; transition: background .2s var(--ease); }
  .neben:hover { background: var(--blau-10); }
  .neben svg { width: 16px; height: 16px; }
  .ideen { margin-top: 18px; max-width: 620px; font-size: 14.5px; color: var(--fg-2); }
  .ideen p { font-family: var(--display); font-weight: 700; font-size: 13.5px; color: var(--fg-muted); }
  .ideen ul { list-style: none; display: grid; gap: 3px; margin-top: 6px; }
  .ideen b { font-weight: 600; color: var(--fg); }
  .diese { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; max-width: 620px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--weiss); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--fg); }
  .chip.minze { background: #CFF7E4; border-color: #A9EBCB; }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .chip .weg { display: inline-grid; place-items: center; width: 22px; height: 22px; margin: -4px -6px -4px 0; border-radius: 50%; color: var(--fg-muted); }
  .chip .weg:hover { background: var(--blau-10); color: var(--blau); }
  .chip .weg svg { width: 12px; height: 12px; }

  .stapel-titel { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--fg-muted); margin-bottom: 8px; }
  .halter { position: relative; }
  .halter::before { content: ''; position: absolute; inset: 0; border-radius: 6px; background: var(--weiss); border: 1.5px solid var(--line); transform: rotate(-1.6deg) translate(-2px, 4px); }
  .halter.minze::before { background: #E3F8EE; border-color: #CDEFDD; }
  .halter.leer::before { display: none; }
  .noch { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--fg-muted); margin-top: 9px; }
  .noch button { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--fg-muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--blau-20); }
  .noch button:hover { color: var(--blau); }
  .ruht .halter { opacity: .55; filter: saturate(.5); }
  .leerkarte { position: relative; border: 1.5px dashed var(--line); border-radius: 6px; padding: 15px 16px; font-size: 14.5px; color: var(--fg-muted); }

  .karte { position: relative; background: var(--weiss); border: 1.5px solid var(--line); border-radius: 6px; padding: 11px 12px 12px; transition: border-color .2s var(--ease), box-shadow .6s var(--ease); }
  .karte svg { width: 15px; height: 15px; display: block; margin-bottom: 6px; }
  .karte p { font-family: var(--display); font-weight: 600; font-size: 13.5px; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; }
  .karte .vorschlag { position: absolute; top: 9px; right: 10px; font-family: var(--display); font-size: 11px; font-weight: 600; color: var(--fg-muted); }
  .karte.gross { padding: 15px 16px 17px; }
  .karte.gross svg { width: 22px; height: 22px; margin-bottom: 8px; }
  .karte.gross p { font-size: 17px; }
  .zettel { position: relative; background: #CFF7E4; border: 1.5px solid #A9EBCB; border-radius: 4px; padding: 10px 28px 10px 11px; font-family: var(--display); font-weight: 600; font-size: 13px; line-height: 1.3; color: var(--dunkel); overflow-wrap: break-word; hyphens: auto; transition: box-shadow .6s var(--ease); }
  .zettel.gross { padding: 15px 16px 17px; font-size: 16.5px; }
  .zettel p { font: inherit; }
  .stand { position: absolute; top: 8px; right: 7px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--blau); background: transparent; padding: 0; }
  .stand.voll { background: var(--blau); }
  .stand.halb { background: linear-gradient(90deg, var(--blau) 50%, transparent 50%); }
  .stand:hover { box-shadow: 0 0 0 3px rgba(54,52,157,.15); }
  .ziehbar { cursor: grab; }
  .ziehbar:hover { border-color: var(--blau); }
  .zettel.ziehbar:hover { border-color: #6FD9A6; }
  .zieht { opacity: .4; }
  .neu { box-shadow: 0 0 0 3px rgba(77,255,176,.6); }
  .karte p[contenteditable="true"], .zettel p[contenteditable="true"] { outline: none; cursor: text; }
  .bearbeitet { border-color: var(--blau) !important; box-shadow: 0 0 0 3px var(--blau-10); }
  .frisch { animation: landen .5s var(--ease); }
  @keyframes landen { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }

  .anlegen { margin-top: 10px; display: grid; gap: 8px; }
  .anlegen input { margin-top: 0; padding: 9px 12px; font-size: 14.5px; border-radius: 8px; }
  .sorten { display: flex; flex-wrap: wrap; gap: 6px; }
  .sorten button { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--fg-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--weiss); }
  .sorten button[aria-pressed="true"] { border-color: var(--blau); color: var(--blau); }

  .bereiche { display: none; grid-template-columns: repeat(8, minmax(0, 1fr)); margin-top: 22px; }
  .zeige-ebenen .bereiche { display: grid; }
  .bereich { margin-right: 16px; border-top: 1.5px solid var(--blau-20); padding-top: 6px; font-family: var(--display); font-size: 12.5px; color: var(--fg-muted); }
  .bereich b { font-weight: 700; color: var(--blau); margin-right: 6px; }
  .b-input { grid-column: 1; } .b-output { grid-column: 2 / 5; } .b-outcome { grid-column: 5 / 8; } .b-impact { grid-column: 8; margin-right: 0; }
  .wand { position: relative; margin-top: 26px; }
  .stapel-reihe { position: absolute; left: 0; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(2, 196px); gap: 30px; align-items: start; }
  .treppe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); align-items: start; padding-top: 20px; }
  .stufe { margin-top: calc((7 - var(--n)) * 40px); padding-right: 16px; display: flex; flex-direction: column; min-height: 220px; border-radius: 6px; }
  .stufe.drueber { background: rgba(77,255,176,.10); }
  .kante { position: relative; height: 10px; background: var(--blau); border-radius: 1px; margin-top: 40px; transition: box-shadow .3s var(--ease); }
  .stufe.vorschlagszone .kante { box-shadow: 0 -5px 0 rgba(77,255,176,.6); }
  .stufe.drueber .kante { box-shadow: 0 -7px 0 var(--minze); }
  .nummer { position: absolute; left: 0; bottom: 100%; width: 42px; height: 36px; background: #DEDDF4; display: grid; place-items: center; font-family: var(--display); font-weight: 300; font-size: 19px; color: var(--dunkel); }
  .fahne { position: absolute; right: 6px; bottom: 100%; width: 30px; height: 46px; }
  .kante .i { position: absolute; right: 0; bottom: calc(100% + 9px); width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; color: var(--blau-40); font-family: var(--display); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; transition: color .2s var(--ease); }
  .stufe[data-n="7"] .kante .i { right: 44px; }
  .stufe:hover .i, .kante .i:focus-visible, .kante .i[aria-expanded="true"] { color: var(--blau); }
  .hilfe-box { position: absolute; z-index: 5; top: calc(100% + 8px); left: 0; width: max(100%, 260px); background: var(--weiss); border: 1.5px solid var(--blau-20); border-radius: 8px; padding: 12px 14px; box-shadow: 0 16px 36px rgba(54,52,157,.14); font-size: 14px; color: var(--fg); }
  .stufe[data-n="6"] .hilfe-box, .stufe[data-n="7"] .hilfe-box { left: auto; right: 0; }
  .hilfe-box .ebene { font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--blau); }
  .hilfe-box .ebene span { font-weight: 400; color: var(--fg-muted); }
  .hilfe-box p { margin-top: 6px; }
  .hilfe-box .bsp { color: var(--fg-2); }
  .frage { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.3; color: var(--fg); margin-top: 10px; }
  .liegen { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .zettel-reihe { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .zettel-reihe:empty { display: none; }

  .fuss { display: flex; justify-content: space-between; align-items: center; gap: 16px 40px; flex-wrap: wrap; margin-top: 28px; padding: 20px 0 48px; border-top: 1.5px solid var(--line); }
  .fuss .links { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .rechts { display: flex; align-items: center; gap: 12px 22px; flex-wrap: wrap; justify-content: flex-end; }
  .als-naechstes { font-size: 15px; color: var(--fg-muted); }
  .hinweis { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--fg-2); max-width: 52em; }
  .hinweis svg { width: 18px; height: 18px; flex: none; }
  .leiser-weg { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--blau); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .haupt { display: inline-flex; align-items: center; gap: 10px; background: var(--blau); color: var(--weiss); font-family: var(--display); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 12px 20px; transition: box-shadow .3s var(--ease); }
  .haupt svg { width: 18px; height: 18px; stroke: var(--weiss); transition: transform .3s var(--ease); }
  .haupt:hover { box-shadow: 0 12px 28px rgba(54,52,157,.25); }
  .haupt:hover svg { transform: translateX(4px); }
  .legende { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--fg-muted); }
  .legende span { display: inline-flex; gap: 7px; align-items: center; }
  .legende i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--blau-40); display: inline-block; }
  .legende i.voll { background: var(--blau-40); } .legende i.halb { background: linear-gradient(90deg, var(--blau-40) 50%, transparent 50%); }

  .entwurf { display: grid; grid-template-columns: minmax(0, 760px) minmax(220px, 1fr); gap: 32px 64px; padding-top: 26px; align-items: start; }
  .blattseite { background: var(--weiss); border: 1.5px solid var(--line); border-radius: 10px; padding: clamp(24px, 3vw, 40px); }
  .blattseite h2 { font-family: var(--display); font-weight: 700; color: var(--blau); font-size: 26px; letter-spacing: -0.02em; line-height: 1.15; }
  .blattseite .zg-zeile { color: var(--fg-2); margin-top: 4px; }
  .abschnitt { margin-top: 26px; }
  .abschnitt h3 { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--fg); }
  .abschnitt h3 span { font-weight: 400; color: var(--fg-muted); }
  .abschnitt ul { margin-top: 6px; padding-left: 20px; display: grid; gap: 3px; }
  .abschnitt .leer { color: var(--fg-muted); margin-top: 4px; font-size: 15.5px; }
  .abschnitt textarea { font-size: 16px; }
  .seitenleiste { display: grid; gap: 14px; position: sticky; top: 20px; }
  .seitenleiste .leise { font-size: 14.5px; color: var(--fg-2); }
  .knopfreihe { display: grid; gap: 10px; justify-items: start; }
  .rahmenknopf { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--blau); color: var(--blau); border-radius: 999px; padding: 9px 16px; font-family: var(--display); font-weight: 700; font-size: 14.5px; }
  .rahmenknopf:hover { background: var(--blau-10); }

  @media (max-width: 900px) {
    .sammeln, .entwurf { grid-template-columns: 1fr; min-height: 0; }
    .sammeln .halter { max-width: 340px; }
    .stapel-reihe { position: static; grid-template-columns: 1fr 1fr; margin-bottom: 24px; }
    .treppe { grid-template-columns: 1fr; padding-top: 0; }
    .stufe { margin-top: 0; min-height: 0; padding: 0 0 20px; }
    .bereiche { display: none !important; }
    .eingabe { flex-direction: column; }
    .neben { padding: 12px 18px; align-self: flex-start; }
    .seitenleiste { position: static; }
  }
  @media print {
    header.top, .schritte, .fuss, .seitenleiste { display: none !important; }
    body { background: #fff; }
    .entwurf { display: block; padding: 0; }
    .blattseite { border: 0; padding: 0; }
    textarea { border: 0; padding: 0; resize: none; }
  }
</style>
</head>
<body>
<div class="blatt">

  <header class="top">
    <a class="brand" href="./"><svg class="strich" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>Wirkungstreppe</a>
    <p class="kontakt">Fragen oder fehlt ein Thema? <a href="wer-macht-was.html">Fragt uns</a></p>
  </header>

  <ol class="schritte" id="schritte" aria-label="Schritte"></ol>
  <main id="ansicht"></main>
  <footer class="fuss" id="fuss"></footer>

</div>

<script>
(function () {
  'use strict';

  var FRAGEN = [
    null,                                                
    { sorte: 'tun', frage: 'Was macht ihr in dem Vorhaben?', unter: 'Schreibt auf, was euch einfällt: was ihr baut, organisiert, schreibt oder beschließt. Eine Sache pro Karte.', ph: 'zum Beispiel: Antragsformular mit Unternehmen testen' },
    { sorte: 'anders', frage: 'Was soll in zwei Jahren anders sein?', unter: 'Was würde eure Zielgruppe merken? Worüber würdet ihr euch freuen?', ph: 'zum Beispiel: Unternehmen reichen vollständige Anträge ein' },
    { sorte: 'merken', frage: 'Woran würdet ihr merken, dass es klappt?', unter: 'Zahlen, die ihr schon habt, und Beobachtungen, die ihr noch nicht erhebt. Kleine sind willkommen.', ph: 'zum Beispiel: Wie oft die Bewilligungsstelle nachfragen muss' }
  ];
  var IDEEN = [
    ['Im eigenen Portal oder Verfahren', 'Aufrufe, Registrierungen, begonnene und abgeschlossene Vorgänge'],
    ['Im Kontakt', 'Hotline, Postfach, Beschwerden'],
    ['Bei der Stelle, die die Fälle bearbeitet', 'Bearbeitungszeit, Nachforderungen'],
    ['Im Berichtswesen', 'was ihr heute schon meldet']
  ];
  var EBENEN = {
    input: ['Input', 'Was wir hineinstecken'], output: ['Output', 'Was wir liefern'],
    outcome: ['Outcome', 'Was sich bei der Zielgruppe verändert'], impact: ['Impact', 'Wozu es beiträgt']
  };
  var STUFEN = [
    { n: 0, e: 'input',   frage: 'Was stecken wir hinein?',        hilfe: 'Leute, Geld, Zeit, Partner: was ihr einsetzt, damit das Vorhaben läuft.', bsp: 'Zwei Leute aus dem Referat, ein Dienstleister, ein Jahr.' },
    { n: 1, e: 'output',  frage: 'Was machen wir?',                hilfe: 'Was ihr baut, organisiert, schreibt oder beschließt.', bsp: 'Der Online-Antrag ist gebaut und mit Unternehmen getestet.' },
    { n: 2, e: 'output',  frage: 'Hört unsere Zielgruppe davon?',  hilfe: 'Erreicht euer Angebot die Zielgruppe überhaupt?', bsp: 'Die Förderdatenbank verlinkt auf den Antrag.' },
    { n: 3, e: 'output',  frage: 'Macht sie mit?',                 hilfe: 'Nimmt die Zielgruppe das Angebot an und probiert es aus?', bsp: 'Die ersten Unternehmen stellen ihren Antrag online.' },
    { n: 4, e: 'outcome', frage: 'Weiß sie, wie es geht?',         hilfe: 'Hat sie das Wissen, das Können und das Zutrauen, es anders zu machen?', bsp: 'Unternehmen trauen sich den Antrag ohne Beratungsfirma zu.' },
    { n: 5, e: 'outcome', frage: 'Macht sie es anders?',           hilfe: 'Macht sie im Alltag tatsächlich etwas anders als vorher?', bsp: 'Unternehmen reichen vollständige Anträge ein.' },
    { n: 6, e: 'outcome', frage: 'Hat sie etwas davon?',           hilfe: 'Wird ihre Lage dadurch dauerhaft besser?', bsp: 'Die Bewilligung dauert Wochen statt Monate.' },
    { n: 7, e: 'impact',  frage: 'Wozu trägt das bei?',            hilfe: 'Wozu trägt das über das Vorhaben hinaus bei? Hier begründet ihr euren Beitrag, beweisen lässt er sich selten.', bsp: 'Fördergeld kommt schneller dort an, wo es etwas bewegen soll.' }
  ];
  var SORTE = {
    input:  { name: 'Das stecken wir hinein', zone: [0],       icon: '<rect x="4" y="13" width="16" height="7" rx="1.5"/><rect x="6" y="5" width="12" height="7" rx="1.5"/>' },
    tun:    { name: 'Das tun wir',            zone: [1, 2, 3], icon: '<path d="M4 12h15M13 6l6 6-6 6"/>' },
    anders: { name: 'Das soll anders sein',   zone: [4, 5, 6], icon: '<path d="M6 21V4"/><path class="akzent" d="M6 4.5l12 4-12 4z"/>' },
    merken: { name: 'Woran wir es merken',    zone: [],        icon: '<circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5"/>' }
  };
  var STAND = { leer: 'noch keine Daten', halb: 'teilweise Daten', voll: 'Daten da' };
  var NAECHSTER_STAND = { leer: 'halb', halb: 'voll', voll: 'leer' };
  var SCHRITTE = [{ id: 'sammeln', name: 'Sammeln' }, { id: 'sortieren', name: 'Sortieren' }, { id: 'entwurf', name: 'Entwurf' }];
  var PFEIL = '<svg class="strich" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

        var c = w.firstChild; ziehbar(c, k.id); bearbeitbar(c, k.id); reihe.appendChild(c);
      });
      el.querySelector('.i').onclick = function (e) { e.stopPropagation(); hilfeOffen = hilfeOffen === s.n ? null : s.n; renderTreppe(); };
      el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('drueber'); });
      el.addEventListener('dragleave', function (e) { if (!el.contains(e.relatedTarget)) el.classList.remove('drueber'); });
      el.addEventListener('drop', function (e) { e.preventDefault(); lege(e.dataTransfer.getData('text/plain'), s.n); });
      t.appendChild(el);
    });
    t.querySelectorAll('[data-stand]').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); var k = finde(b.dataset.stand); k.stand = NAECHSTER_STAND[k.stand] || 'halb'; speichern(); renderTreppe(); renderFussSortieren(); };
    });
  }

  function hinweisText() {
    var gelegt = function (sorte) { return S.karten.filter(function (k) { return k.sorte === sorte && k.stufe !== null; }); };
    var outcome = S.karten.filter(function (k) { return !istZettel(k) && k.stufe >= 4 && k.stufe <= 6; });
    var andersUnten = gelegt('anders').filter(function (k) { return k.stufe <= 3; });
    var zettel = gelegt('merken'), oben = zettel.filter(function (k) { return k.stufe >= 4; });
    if (!S.karten.length) return 'Noch keine Karten. Beim Sammeln entstehen sie aus euren Antworten.';
    if (andersUnten.length) return 'Eine Karte „Das soll anders sein“ liegt bei dem, was ihr liefert. Ist das schon eine Veränderung bei eurer Zielgruppe, oder noch eure Arbeit?';
    if (phase() === 'zettel' && !outcome.length) return 'Bei Outcome liegt noch nichts. Was soll eure Zielgruppe anders machen?';
    if (zettel.length >= 2 && !oben.length) return 'Eure Zettel zeigen, dass es ankommt. Bekommt ihr irgendwo mit, ob sich bei eurer Zielgruppe etwas ändert?';
    if (phase() === 'zettel' && !stapelZettel().length) return 'Alles liegt. Im Entwurf seht ihr, was daraus wird.';
    if (S.karten.some(function (k) { return k.vorschlag; })) return 'Karten mit „Vorschlag“ haben wir gelegt. Lasst sie liegen oder verschiebt sie.';
    return phase() === 'karten' ? 'Der helle Strich über einer Stufe ist ein Vorschlag, wohin die Karte passen könnte. Ihr entscheidet.' : 'Unsicher, wohin ein Zettel gehört? Legt ihn unter die Stufe, über die er am meisten sagt.';
  }
  function renderFussSortieren() {
    var legende = phase() === 'zettel' ? '<div class="legende"><span><i class="voll"></i>Daten da</span><span><i class="halb"></i>teilweise</span><span><i></i>noch keine</span></div>' : '';
    $('fuss').innerHTML = '<div class="links"><p class="hinweis">' + LUPE + '<span>' + esc(hinweisText()) + '</span></p>' + legende + '</div>' +
      '<button class="haupt" type="button" id="weiter">Weiter: Entwurf' + PFEIL + '</button>';
    $('weiter').onclick = function () { geheZu('entwurf'); };
  }

  function karten(ebene) {
    return S.karten.filter(function (k) { return !istZettel(k) && k.stufe !== null && STUFEN[k.stufe].e === ebene; })
      .sort(function (a, b) { return b.stufe - a.stufe; });
  }
  function zettelZeilen() {
    return ['impact', 'outcome', 'output', 'input'].map(function (e) {
      var zs = S.karten.filter(function (k) { return istZettel(k) && k.stufe !== null && STUFEN[k.stufe].e === e; });
      if (!zs.length) return null;
      return { e: e, zs: zs };
    }).filter(Boolean);
  }
  function offenes() {
    var o = [];
    ['impact', 'outcome', 'output'].forEach(function (e) { if (!karten(e).length) o.push('Bei ' + EBENEN[e][0] + ' liegt noch nichts.'); });
    var sk = stapelKarten().length, sz = stapelZettel().length;
    if (sk) o.push(sk + (sk === 1 ? ' Karte liegt' : ' Karten liegen') + ' noch auf dem Stapel.');
    if (sz) o.push(sz + (sz === 1 ? ' Zettel liegt' : ' Zettel liegen') + ' noch auf dem Stapel.');
    var ohne = S.karten.filter(function (k) { return istZettel(k) && k.stufe !== null && k.stand === 'leer'; }).length;
    if (ohne) o.push('Zu ' + ohne + (ohne === 1 ? ' Beobachtung gibt' : ' Beobachtungen gibt') + ' es noch keine Daten.');
    return o;
  }
  var ABSCHNITTE = [['impact', 'Wozu es beiträgt'], ['outcome', 'Was sich bei der Zielgruppe verändert'], ['output', 'Was wir liefern'], ['input', 'Was wir hineinstecken']];

  function renderEntwurf() {
    var a = $('ansicht');
    var titel = S.vorhaben.trim() || 'Euer Vorhaben';
    var html = '<div class="kopf"><div><h1>Euer Entwurf</h1><p class="unter">Hier steht, was ihr auf die Treppe gelegt habt. Die Zusammenfassung schreibt ihr selbst, in euren Worten.</p></div></div>' +
      '<div class="entwurf"><article class="blattseite" id="blattseite">' +
      '<h2>' + esc(titel) + '</h2>' + (zg() ? '<p class="zg-zeile">Zielgruppe: ' + esc(zg()) + '</p>' : '') +
      '<section class="abschnitt"><h3>Kurz gesagt</h3><textarea id="zusammenfassung" aria-label="Zusammenfassung in euren Worten" placeholder="Was macht ihr, was soll sich bei eurer Zielgruppe ändern, und woran merkt ihr es? In euren eigenen Worten, ein paar Sätze.">' + esc(S.zusammenfassung) + '</textarea></section>';
    ABSCHNITTE.forEach(function (ab) {
      var ks = karten(ab[0]);
      html += '<section class="abschnitt"><h3>' + ab[1] + ' <span>· ' + EBENEN[ab[0]][0] + '</span></h3>' +
        (ks.length ? '<ul>' + ks.map(function (k) { return '<li>' + esc(k.t) + '</li>'; }).join('') + '</ul>' : '<p class="leer">Noch offen.</p>') + '</section>';
    });
    var zz = zettelZeilen();
    html += '<section class="abschnitt"><h3>Woran wir es merken</h3>' + (zz.length ? '<ul>' + zz.map(function (z) {
      return z.zs.map(function (k) { return '<li>' + EBENEN[z.e][0] + ': ' + esc(k.t) + ' (' + (z.e === 'impact' ? 'Beitrag begründen' : STAND[k.stand]) + ')</li>'; }).join('');
    }).join('') + '</ul>' : '<p class="leer">Noch keine Zettel auf der Treppe.</p>') + '</section>';
    html += '<section class="abschnitt"><h3>Wovon es abhängt</h3><p class="leer">Kommt aus der Portfolio-Steuerung, sobald das Werkzeug im SharePoint läuft.</p></section>';
    var off = offenes();
    html += '<section class="abschnitt"><h3>Was noch offen ist</h3>' + (off.length ? '<ul>' + off.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>' : '<p class="leer">Nichts, soweit das Werkzeug es sieht.</p>') + '</section>';
    html += '</article><aside class="seitenleiste"><p class="leise">Den Text könnt ihr kopieren und weitergeben, oder die Seite drucken. Gespeichert ist alles in diesem Browser.</p>' +
      '<div class="knopfreihe"><button type="button" class="rahmenknopf" id="kopieren">Text kopieren</button><button type="button" class="rahmenknopf" id="drucken">Drucken</button></div></aside></div>';
    a.innerHTML = html;
    $('zusammenfassung').addEventListener('input', function (e) { S.zusammenfassung = e.target.value; speichern(); });
    $('drucken').onclick = function () { window.print(); };
    $('kopieren').onclick = function () {
      var b = $('kopieren'), text = textFassung();
      function ok() { b.textContent = 'Kopiert'; setTimeout(function () { b.textContent = 'Text kopieren'; }, 1600); }
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () { altKopieren(text); ok(); }); else { altKopieren(text); ok(); }
    };
  }
  function altKopieren(text) { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }
  function textFassung() {
    var z = [S.vorhaben.trim() || 'Euer Vorhaben'];
    if (zg()) z.push('Zielgruppe: ' + zg());
    z.push('', 'Kurz gesagt', S.zusammenfassung.trim() || '(noch offen)');
    ABSCHNITTE.forEach(function (ab) { var ks = karten(ab[0]); z.push('', ab[1] + ' (' + EBENEN[ab[0]][0] + ')'); if (ks.length) ks.forEach(function (k) { z.push('- ' + k.t); }); else z.push('(noch offen)'); });
    z.push('', 'Woran wir es merken');
    var zz = zettelZeilen(); if (zz.length) zz.forEach(function (x) { x.zs.forEach(function (k) { z.push('- ' + EBENEN[x.e][0] + ': ' + k.t + ' (' + (x.e === 'impact' ? 'Beitrag begründen' : STAND[k.stand]) + ')'); }); }); else z.push('(noch offen)');
    var off = offenes(); if (off.length) { z.push('', 'Was noch offen ist'); off.forEach(function (o) { z.push('- ' + o); }); }
    return z.join('\n');
  }
  function fussEntwurf() {
    $('fuss').innerHTML = '<div class="links"><button type="button" class="leiser-weg" id="zurueck">Zurück zum Sortieren</button></div><span></span>';
    $('zurueck').onclick = function () { geheZu('sortieren'); };
  }

  function render() {
    renderSchritte();
    $('ansicht').classList.remove('zeige-ebenen');
    if (S.ansicht === 'sortieren') { renderSortieren(); renderFussSortieren(); }
    else if (S.ansicht === 'entwurf') { renderEntwurf(); fussEntwurf(); }
    else { S.ansicht = 'sammeln'; renderSammeln(); fussSammeln(); }
  }

  document.addEventListener('keydown', function (e) {
    var a = document.activeElement;
    if (a && a.id === 'aktuell' && /^[0-7]$/.test(e.key)) { lege(a.dataset.id, +e.key); var n = $('aktuell'); if (n) n.focus(); }
    if (e.key === 'Escape' && hilfeOffen !== null) { hilfeOffen = null; if ($('treppe')) renderTreppe(); }
  });
  document.addEventListener('click', function (e) {
    if (hilfeOffen !== null && !e.target.closest('.hilfe-box') && !e.target.closest('.i')) { hilfeOffen = null; if ($('treppe')) renderTreppe(); }
  });

  render();
})();
</script>
