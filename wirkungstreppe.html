<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wirkungstreppe (Entwurf)</title>
<link rel="stylesheet" href="gemeinsam.css">
<style>

  :root { --eintrag: 20px; --rb: 320px; --rm: 140px; --kartenrand: var(--line); }

  body { font-size: 17px; line-height: 1.5; padding-bottom: 96px; }
  main { padding-top: clamp(16px, 3.6vh, 44px); padding-bottom: 32px; }
  h1 { font-family: var(--display); font-weight: 700; color: var(--blau); font-size: clamp(38px, min(4.2vw, 5.4vh), 52px); line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
  h1 .leicht { font-weight: 300; }
  h1:focus { outline: none; }

  .wort, .feldkopf label, .feldkopf .feldfrage, .abschnitt h2 { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.5; color: var(--fg-2); }
  .kopfzeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; font-size: 15px; color: var(--fg-muted); margin-bottom: 12px; }
  .lead { font-size: 20px; color: var(--fg-2); margin-top: 14px; max-width: 32em; text-wrap: pretty; }

  .karte { margin-top: 28px; background: var(--weiss); border: 1px solid var(--kartenrand); border-radius: 14px; }
  .zeile + .zeile { border-top: 1px solid var(--line); }
  .zeile.ohne-linie { border-top: 0 !important; }

  .zone { position: relative; isolation: isolate; }
  .zone::before { content: ''; position: absolute; inset: var(--zone, 4px 8px); border-radius: 10px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .25s var(--ease), box-shadow .25s var(--ease); }
  .zone:focus-within::before { opacity: 1; background: var(--blau-10); }

  .karte .zone { --zone: 4px; }
  .karte .zone::before { border-radius: 3px; }
  .karte > .zone:first-child::before,
  .karte > .liste:first-child > .zone:first-child::before { border-top-left-radius: 9px; border-top-right-radius: 9px; }
  .karte > .zone:last-child::before,
  .karte > .liste:last-child > .zone:last-child::before,
  .karte > .angabe:last-child .liste > .zone:last-child::before { border-bottom-left-radius: 9px; border-bottom-right-radius: 9px; }

  .karte > .liste > .zone:only-child:focus-within::before { opacity: 0; }

  body.tastatur .zone:focus-within::before { box-shadow: inset 0 0 0 2px var(--blau); }

  .angabe { padding: 16px 28px; }
  .feldkopf { font-size: 15px; line-height: 1.5; color: var(--fg-muted); }
  .angabe .wachs { margin-top: 4px; font-size: var(--eintrag); }
  .angabe.kopf-liste { padding-bottom: 2px; }

  .eintrag { position: relative; padding: 13px 60px 13px 58px; font-size: var(--eintrag); }
  .eintrag.neu { padding-right: 28px; }
  .marke { position: absolute; left: 26px; top: calc(13px + .7em - 8px); width: 16px; height: 16px; }
  .marke svg { display: block; width: 16px; height: 16px; overflow: visible; }
  .eintrag.frisch .marke svg { animation: auftauchen .4s var(--ease) both; }

  .wachs { display: grid; }
  .wachs::after { content: attr(data-wert) ' '; white-space: pre-wrap; overflow-wrap: break-word; visibility: hidden; grid-area: 1 / 1; font: inherit; line-height: 1.4; }
  .wachs.leer::after { font-style: italic; }
  .wachs > textarea { grid-area: 1 / 1; }
  textarea { display: block; width: 100%; font: inherit; line-height: 1.4; color: var(--fg); background: transparent; border: 0; padding: 0; resize: none; overflow: hidden; overflow-wrap: break-word; caret-color: var(--blau); }

  textarea::placeholder { color: var(--fg-muted); font-style: italic; font-size: 15px; opacity: 1; }
  textarea:focus, textarea:focus-visible { outline: none; }

  .entf { position: absolute; right: 14px; top: calc(13px + .7em - 17px); width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; opacity: 0; transition: opacity .3s var(--ease), background-color .3s var(--ease); }
  .entf svg { width: 14px; height: 14px; stroke: var(--fg-muted); stroke-width: 1.75; }
  .eintrag:hover .entf, .eintrag:focus-within .entf { opacity: 1; }
  .entf:hover { background: var(--blau-10); }
  .entf:hover svg { stroke: var(--blau); }
  .entf:focus-visible { opacity: 1; outline: 3px solid var(--blau); outline-offset: 2px; }

  .zahlen { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; margin-top: 6px; font-size: 15px; color: var(--fg-muted); animation: einblenden .3s var(--ease) both; }
  .zahlen label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .zahlen input { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 0; border: 1.5px solid var(--fg-muted); border-radius: 50%; background: var(--weiss); cursor: pointer; transition: background-color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease); }
  .zahlen input:checked { border-color: var(--blau); background: var(--blau); box-shadow: inset 0 0 0 3px var(--weiss); }
  .zahlen input:checked + span { color: var(--fg); }
  .zahlen input:focus-visible { outline: 3px solid var(--blau); outline-offset: 3px; }
  .beruhigung { margin-top: 2px; font-size: 15px; color: var(--fg-muted); animation: einblenden .3s var(--ease) both; }

  .stand { display: inline-block; margin-top: 2px; font-family: var(--body); font-weight: 400; font-size: 15px; color: var(--fg-muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color .3s var(--ease), text-decoration-color .3s var(--ease), opacity .3s var(--ease); }
  .stand:hover, .stand:focus-visible { color: var(--blau); text-decoration-color: currentColor; }
  .stand:focus-visible { outline: 3px solid var(--blau); outline-offset: 3px; }

  #liste-merken:not(.knapp) .stand { position: absolute; right: 58px; top: 17px; margin: 0; }
  #liste-merken:not(.knapp) .eintrag:not(.neu) { padding-right: 230px; }
  .stand.ohne { opacity: 0; }
  .eintrag:hover .stand.ohne, .eintrag:focus-within .stand.ohne, .stand.ohne:focus-visible { opacity: 1; }

  .aktionen { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 30px; margin-top: 26px; }
  .haupt { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--weiss); background: var(--blau); border: 0; border-radius: 999px; padding: 14px 26px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: box-shadow .3s var(--ease); }
  .haupt svg { width: 17px; height: 17px; stroke: var(--weiss); transition: transform .3s var(--ease); }
  .haupt:hover { box-shadow: 0 14px 30px rgba(54,52,157,.22); }
  .haupt:hover svg { transform: translateX(5px); }
  .haupt:focus-visible { outline: 3px solid var(--blau); outline-offset: 3px; }
  .noch-leer { font-size: 15px; color: var(--fg-muted); text-align: center; max-width: 34em; }

  .ring { position: relative; width: 100%; aspect-ratio: 1; }
  .ring::before { content: ''; position: absolute; inset: -6%; border-radius: 50%; background: radial-gradient(closest-side, rgba(77,255,176,.26), rgba(227,230,242,.5) 62%, rgba(247,247,252,0)); opacity: 0; transition: opacity .5s var(--ease); }
  .ring.glueht::before { opacity: 1; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring .dreh { transform-box: view-box; transform-origin: 230px 230px; transition: transform .5s var(--ease); }
  .ring .halo { stroke: var(--blau-20); stroke-opacity: .55; }
  .fig-texte { position: absolute; inset: 0; pointer-events: none; }
  .fig-texte > div { position: absolute; transition: opacity .3s var(--ease); }
  .wort-pos { white-space: nowrap; }
  .ring-wort { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.3; color: var(--fg-2); padding: 2px 0; }

  .zg-block { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; --zone: -6px -12px; }
  .zg-block .fuer { display: block; font-family: var(--body); font-size: 15px; line-height: 1.4; color: var(--fg-muted); margin-bottom: 2px; cursor: text; }
  .zg-text { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.3; color: var(--fg); hyphens: auto; -webkit-hyphens: auto; hyphenate-limit-chars: 8 4 4; overflow-wrap: normal; outline: none; caret-color: var(--blau); }
  .zg-text:empty::before { content: attr(data-ph); color: var(--fg-muted); font-style: italic; font-weight: 400; }

  .ring .auftauchen { animation: auftauchen .4s var(--ease) both; transform-box: fill-box; transform-origin: center; }
  .ring .einblenden { animation: einblenden .4s var(--ease) both; }
  .ring .geht { opacity: 0 !important; transition: opacity .25s var(--ease) !important; }
  .ring circle, .ring g.punkt { transition: transform .45s var(--ease), opacity .3s var(--ease), stroke .3s var(--ease), stroke-dasharray .45s var(--ease), stroke-width .3s var(--ease); }
  .ring.still *, .ring.still::before { transition: none !important; animation: none !important; }
  @keyframes auftauchen { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }

  .ring g.in { transform-box: fill-box; transform-origin: center; transition: transform .3s var(--ease); }
  .ring g.punkt.hervor g.in { transform: scale(1.5); }
  .ring[data-groesse="mittel"] g.punkt.hervor g.in { transform: scale(1.6); }
  .ring g.punkt.blass { opacity: .35; }

  .ring g.punkt.wartet { opacity: 0; }

  .flieger { position: fixed; left: 0; top: 0; z-index: 4; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; will-change: transform; }
  .flieger svg { display: block; width: 16px; height: 16px; overflow: visible; }

  .spalte-b { max-width: calc(var(--rm) + 56px + 780px); margin: 0 auto; display: grid; grid-template-columns: var(--rm) minmax(0, 1fr); column-gap: 56px; align-items: start; }
  .kopf-b { position: sticky; top: 20px; }
  .kopf-b .ring { width: var(--rm); }

  .name-klein { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--fg-2); margin-bottom: 12px; --zone: -3px -10px; }
  .name-klein textarea { line-height: 1.5; }
  .name-klein .wachs::after { line-height: 1.5; }
  .raster-b { --ring: var(--rb); display: grid; grid-template-columns: max(344px, var(--ring)) minmax(0, 1fr); column-gap: 64px; align-items: start; max-width: 1080px; margin: 0 auto; }
  .seite-b { position: sticky; top: 20px; display: flex; flex-direction: column; align-items: center; }
  .seite-b .ring { width: var(--ring); }
  .fuss-ueber { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 26px; }

  .zeilen { margin-top: 26px; max-width: 720px; border-bottom: 1px solid var(--line); }
  .abschnitt { display: grid; grid-template-columns: 190px minmax(0, 1fr); column-gap: 28px; padding: 14px 0; border-top: 1px solid var(--line); transition: opacity .3s var(--ease); }
  .abschnitt h2 { position: relative; margin: 0; padding-top: 2px; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.4; color: var(--blau); }

  .abschnitt.blass { opacity: .4; }

  .bogenzeichen { position: absolute; left: -38px; top: 0; width: 26px; height: 26px; overflow: visible; }
  .liste.knapp { --eintrag: 17px; }
  .liste.knapp .eintrag + .eintrag { border-top: 0; }
  .liste.knapp .eintrag { padding: 2px 10px 2px 0; --zone: 0 0 0 -10px; }

  .liste.knapp .stand, .liste.knapp .zahlen, .liste.knapp .beruhigung { display: none; }

  .danach { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 96px; align-items: center; margin-top: clamp(24px, 6vh, 72px); }
  .danach .lead { max-width: 28em; }
  .danach-ring { --ring: 320px; }
  .danach-ring .ring { width: var(--ring); }
  .nebenwege { display: flex; flex-wrap: wrap; gap: 10px 30px; margin-top: 22px; }

  @media (max-height: 820px) and (min-width: 901px) {
    :root { --rb: 290px; --rm: 120px; }
    main { padding-top: 10px; }
    .kopfzeile, .name-klein { margin-bottom: 8px; }
    .lead { margin-top: 8px; }
    .karte { margin-top: 18px; }
    .angabe { padding-top: 11px; padding-bottom: 11px; }
    .eintrag { padding-top: 9px; padding-bottom: 9px; }
    .marke { top: calc(9px + .7em - 8px); }
    .entf { top: calc(9px + .7em - 17px); }
    #liste-merken:not(.knapp) .stand { top: 13px; }
    .aktionen { margin-top: 18px; }
    .kopf-b, .seite-b { top: 12px; }
    .fuss-ueber { margin-top: 18px; }
    .zeilen { margin-top: 18px; }
    .abschnitt { padding: 10px 0; }
    .liste.knapp .eintrag { padding-top: 1px; padding-bottom: 1px; }
  }
  @media (max-width: 900px) {
    .spalte-b { display: block; max-width: 780px; }
    .kopf-b { position: static; margin-bottom: 26px; }
    .kopf-b .ring { width: 96px; }
    .raster-b { display: block; }
    .abschnitt { grid-template-columns: minmax(0, 1fr); row-gap: 4px; }
    .abschnitt h2 { padding-left: 36px; }
    .bogenzeichen { left: 0; }
    .seite-b { position: static; margin-bottom: 26px; }
    .danach { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring *, .ring::before, .zahlen, .beruhigung, .marke svg, .zone::before { animation: none !important; transition: none !important; }
    .flieger { display: none; }
  }
</style>
</head>
<body>
<div class="blatt">
  <header class="top">
    <a class="weg" href="./"><span class="kreis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span><span class="text">Startseite</span></a>
    <p class="kontakt"><span>Fragen oder fehlt ein Thema?</span><a class="weg" href="wer-macht-was.html"><span class="kreis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v10h-8l-4.5 3.5v-3.5H5z"/></svg></span><span class="text">Fragt uns</span></a></p>
  </header>
  <main id="buehne"></main>
  <template id="name-werkstatt">Wirkungswerkstatt</template>
</div>

<script>
(function () {
  'use strict';

  var KEYS = ['einsatz', 'tun', 'anders', 'merken'];

  var WORTE = ['Das steckt drin', 'Das passiert', 'Das ändert sich', 'Daran zeigt es sich'];

  var LISTEN = {
    einsatz: { bsp: 'zum Beispiel: zwei Leute aus dem Referat',
      weiter: ['Noch etwas? Geld aus dem Haushalt?', 'Noch etwas? Hilfe von außen?'] },
    tun: { frage: 'Was tut ihr dafür?', lead: 'Eine Sache je Zeile. Mit Enter kommt die nächste.',
      bsp: 'zum Beispiel: Antragsformular mit Unternehmen testen',
      weiter: ['Noch etwas? Was baut oder schreibt ihr?', 'Noch etwas? Was führt ihr durch?', 'Noch etwas? Wie erfährt die Zielgruppe davon?', 'Noch etwas? Was hilft der Zielgruppe mitzumachen?'] },
    anders: { frage: 'Was soll in einem Jahr anders sein', lead: 'Gemeint ist die Zielgruppe, nicht eure eigene Arbeit.',
      bsp: 'zum Beispiel: Unternehmen reichen vollständige Anträge ein',
      weiter: ['Noch etwas? Was weiß oder kann die Zielgruppe dann?', 'Noch etwas? Was macht die Zielgruppe dann anders?', 'Noch etwas? Was hat die Zielgruppe davon?'] },
    merken: { frage: 'Woran merkt ihr, dass es klappt?', lead: 'Auch wenn es dazu noch keine Zahlen gibt.',
      bsp: 'zum Beispiel: Zeit vom Antrag bis zur Bewilligung',
      weiter: ['Noch etwas? Was seht ihr im eigenen Portal oder Verfahren?', 'Noch etwas? Was kommt bei der Hotline oder im Postfach an?', 'Noch etwas? Was merkt die Stelle, die die Fälle bearbeitet?', 'Noch etwas? Was meldet ihr heute schon?'] }
  };
  var ZAHLEN = [['ja', 'gibt es'], ['teilweise', 'teilweise'], ['nein', 'noch keine']];
  var STAND = { ja: 'Zahlen gibt es', teilweise: 'Zahlen gibt es teilweise', nein: 'Noch keine Zahlen', '': 'Zahlen dazu?' };
  var BERUHIGUNG = 'Reicht für jetzt. Die Zahlen kommen später.';

  var S = { name: '', zielgruppe: '', einsatz: [], tun: [], anders: [], merken: [], schritt: 1, abgegeben: false,
            zahlenOffen: -1, beruhigt: -1, hervor: null, unterwegs: new Set() };

  var MERKER = 'wirkungstreppe-vorarbeit';
  function nurEintraege(a) { return (a || []).filter(function (e) { return e && e.text; }).map(function (e) { var o = { text: String(e.text) }; if (e.zahlen !== undefined) o.zahlen = e.zahlen; return o; }); }
  try {
    var gemerkt = JSON.parse(sessionStorage.getItem(MERKER) || 'null');
    if (gemerkt) { S.name = gemerkt.name || ''; S.zielgruppe = gemerkt.zielgruppe || ''; S.einsatz = nurEintraege(gemerkt.einsatz); S.tun = nurEintraege(gemerkt.tun); S.anders = nurEintraege(gemerkt.anders); S.merken = nurEintraege(gemerkt.merken); }
  } catch (e) {}
  function eingabenMerken() {
    try { sessionStorage.setItem(MERKER, JSON.stringify({ name: S.name, zielgruppe: S.zielgruppe, einsatz: nurEintraege(S.einsatz), tun: nurEintraege(S.tun), anders: nurEintraege(S.anders), merken: nurEintraege(S.merken) })); } catch (e) {}
  }
  addEventListener('pagehide', eingabenMerken);
  document.addEventListener('visibilitychange', function () { if (document.hidden) eingabenMerken(); });

  function $(id) { return document.getElementById(id); }

  var WW = document.getElementById('name-werkstatt').content.textContent.trim();
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var PFEIL = '<svg class="strich" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

  var ZEICHEN = { links: '<path d="M19 12H5M11 6l-6 6 6 6"/>', datei: '<path d="M12 4v10.5M7.5 10l4.5 4.5 4.5-4.5M5 19.5h14"/>', stift: '<path d="M15 5l4 4-10 10H5v-4z"/><path d="M13 7l4 4"/>' };
  function wegKnopf(text, z, attr) { return '<button type="button" class="weg" ' + attr + '><span class="kreis"><svg viewBox="0 0 24 24" aria-hidden="true">' + ZEICHEN[z] + '</svg></span><span class="text">' + text + '</span></button>'; }
  var KREUZ = '<svg class="strich" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>';
  function ansicht() { return S.abgegeben ? 'danach' : S.schritt === 5 ? 'ueber' : 'schritt'; }
  function gefuellt(key) { return S[key].filter(function (e) { return e.text && e.text.trim(); }); }

  function feld(id, wert, ph, aria, extra) {
    return '<div class="wachs' + (wert ? '' : ' leer') + '" data-wert="' + esc(wert || ph) + '">' +
      '<textarea id="' + id + '" rows="1"' + (aria ? ' aria-label="' + esc(aria) + '"' : '') + (extra || '') +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(wert) + '</textarea></div>';
  }

  var PUNKT_R = 4.5, PUNKT_RAND = 1.5;
  function art() { return 'minze'; }
  function glyph(a, r, sw) {
    var rand = 'stroke:var(--blau);stroke-width:' + sw + 'px;';
    if (a === 'blau') return '<circle r="' + r + '" style="fill:var(--blau);' + rand + '"/>';
    if (a === 'minze') return '<circle r="' + r + '" style="fill:var(--minze);' + rand + '"/>';
    return '<circle r="' + r + '" style="fill:none;stroke:var(--blau-20);stroke-width:' + sw + 'px"/>';
  }
  function marke(a) { return '<span class="marke" aria-hidden="true"><svg viewBox="-8 -8 16 16">' + glyph(a, PUNKT_R, PUNKT_RAND) + '</svg></span>'; }

  function zahlenHTML(i, e) {
    var t = e.text ? '„' + e.text + '“' : 'diesem Eintrag';
    if (S.zahlenOffen === i) {
      var h = '<div class="zahlen" role="radiogroup" aria-label="Gibt es Zahlen zu ' + esc(t) + '?"><span aria-hidden="true">Zahlen dazu:</span>';
      ZAHLEN.forEach(function (z) {
        h += '<label><input type="radio" name="z-' + i + '" value="' + z[0] + '" data-i="' + i + '"' + (e.zahlen === z[0] ? ' checked' : '') + '><span>' + z[1] + '</span></label>';
      });
      return h + '</div>';
    }
    return '<button type="button" class="stand' + (e.zahlen ? '' : ' ohne') + '" data-stand="' + i + '" aria-label="' + esc(STAND[e.zahlen || ''] + ', ändern: ' + t) + '">' + STAND[e.zahlen || ''] + '</button>' +
      (S.beruhigt === i && e.zahlen === 'nein' ? '<p class="beruhigung" role="status">' + BERUHIGUNG + '</p>' : '');
  }
  function eintragHTML(key, i, e, ort, frisch) {
    var b = KEYS.indexOf(key);

    return '<div class="eintrag zeile zone' + (frisch ? ' frisch' : '') + '" data-i="' + i + '">' + (ort === 'ueber' ? '' : marke(art(b))) +
      feld(key + '-' + i, e.text, '', WORTE[b] + ', Eintrag ' + (i + 1)) +
      (ort === 'schritt' ? '<button type="button" class="entf" data-weg="' + i + '" aria-label="' + esc('„' + e.text + '“ entfernen') + '">' + KREUZ + '</button>' : '') +

      aktionen('<button type="button" class="haupt" data-geh="' + (s + 1) + '">' + (s === 4 ? 'Alles ansehen' : 'Weiter') + ' ' + PFEIL + '</button>',
               wegKnopf('Zurück', 'links', 'data-geh="' + (s - 1) + '"'));
  }

  function kopfUebersicht() {
    return '<div class="name-klein zone">' + feld('f-name', S.name, 'Name des Vorhabens', 'Name des Vorhabens') + '</div>' +
      '<h1 tabindex="-1">Passt das so?</h1>' +
      '<p class="lead">Hier könnt ihr noch alles ändern. Danach geht es an die ' + WW + '.</p>';
  }

  function bogenzeichen(i) {
    return '<svg class="bogenzeichen" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--blau-20)" stroke-width="1.5"/>' +
      '<circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--blau)" stroke-width="3" stroke-linecap="round" pathLength="360" stroke-dasharray="80 360" transform="rotate(' + (-90 + 90 * i + 5) + ' 12 12)"/></svg>';
  }

  function abschnitt(i) {
    return '<section class="abschnitt" data-bogen="' + i + '"><h2>' + bogenzeichen(i) + '<span>' + WORTE[i] + '</span></h2>' + liste(KEYS[i], 'ueber', 'knapp') + '</section>';
  }

  function fussUebersicht() {
    return '<p class="noch-leer" id="noch-leer" role="status"></p>' +
      '<button type="button" class="haupt" id="abschicken">An die ' + WW + ' schicken ' + PFEIL + '</button>' +
      wegKnopf('Zurück', 'links', 'data-geh="4"');
  }

  function inhaltDanach() {
    return (S.name.trim() ? '<p class="name-klein">' + esc(S.name.trim()) + '</p>' : '') +
      '<h1 tabindex="-1">Ist angekommen. Danke!</h1>' +
      '<p class="lead">Die ' + WW + ' sichtet eure Antworten und meldet sich für einen Termin. Bis zum Workshop müsst ihr nichts weiter tun.</p>' +
      aktionen('<a class="haupt" href="./">Zur Startseite ' + PFEIL + '</a>') +
      '<div class="nebenwege">' + wegKnopf('Als Datei speichern', 'datei', 'id="datei"') + wegKnopf('Noch etwas ändern', 'stift', 'id="nochmal"') + '</div>';
  }

  function geruestArt() { return ansicht(); }
  function geruest(art) {
    if (art === 'schritt') return '<div class="spalte-b"><div class="kopf-b"><div class="ring" id="ring"></div></div><div id="inhalt"></div></div>';
    if (art === 'ueber') return '<div class="ueber"><div class="raster-b" data-ringbasis>' +
      '<div class="seite-b"><div class="ring" id="ring"></div><div class="fuss-ueber" id="fuss"></div></div>' +
      '<div><div id="inhalt"></div><div class="zeilen"><div id="zelle-0"></div><div id="zelle-1"></div><div id="zelle-2"></div><div id="zelle-3"></div></div></div>' +
      '</div></div>';
    return '<div class="danach"><div id="inhalt"></div><div class="danach-ring" data-ringbasis><div class="ring" id="ring"></div></div></div>';
  }

  var main = $('buehne'), jetzt = null;
  function render(ohneFokus) {
    var art = geruestArt(), v = ansicht();
    if (art !== jetzt) { alleLanden(); main.innerHTML = geruest(art); jetzt = art; fig = new Figur($('ring')); }
    var inh = $('inhalt');
    if (v === 'danach') inh.innerHTML = inhaltDanach();
    else if (v === 'ueber') {
      inh.innerHTML = kopfUebersicht();
      for (var i = 0; i < 4; i++) $('zelle-' + i).innerHTML = abschnitt(i);
      $('fuss').innerHTML = fussUebersicht();
    }
    else if (S.schritt === 1) inh.innerHTML = inhaltVorhaben();
    else inh.innerHTML = inhaltListe(S.schritt);
    var el1 = $('liste-einsatz'); if (el1 && el1.classList.contains('in-karte') && el1.firstChild) el1.firstChild.classList.add('ohne-linie');
    zeichne();
    zgEinpassen();
    nochLeer();
    if (ohneFokus === true) return;

    var ziel = null;
    if (v === 'schritt') ziel = S.schritt === 1 ? (!S.name ? $('f-name') : !S.zielgruppe ? $('f-zielgruppe') : $('einsatz-neu')) : $(KEYS[S.schritt - 1] + '-neu');
    (ziel || main.querySelector('h1')).focus({ preventScroll: true });
  }

  function nochLeer() {
    var el = $('noch-leer'); if (!el) return;
    var leer = [];
    if (!S.zielgruppe.trim()) leer.push('für wen');
    KEYS.forEach(function (k, i) { if (!gefuellt(k).length) leer.push(WORTE[i]); });
    el.textContent = leer.length ? 'Noch leer: ' + leer.join(', ') + '. Ihr könnt trotzdem schicken.' : '';
    el.hidden = !leer.length;
  }

  function listeVon(el) { var l = el.closest('.liste[data-key]'); return l ? l.getAttribute('data-key') : null; }
  function geaendert() { zeichne(); nochLeer(); }

  function uebernehmen(key, fokusNeu) {
    var t = $(key + '-neu'); if (!t) return;
    var text = t.value.trim(); if (!text) return;
    var e = { text: text }; if (key === 'merken') e.zahlen = '';
    S[key].push(e);
    var i = S[key].length - 1, ort = $('liste-' + key).getAttribute('data-ort');
    var flug = darfFliegen();
    var zeile = t.closest('.eintrag'), d = document.createElement('div');

    var vorher = S.zahlenOffen;
    if (key === 'merken' && ort === 'schritt') { S.zahlenOffen = fokusNeu ? i : -1; S.beruhigt = -1; }
    d.innerHTML = eintragHTML(key, i, e, ort, !flug);
    var neu = d.firstChild;
    if (zeile.classList.contains('ohne-linie')) { zeile.classList.remove('ohne-linie'); neu.classList.add('ohne-linie'); }
    zeile.parentNode.insertBefore(neu, zeile);
    if (key === 'merken' && vorher >= 0 && vorher !== S.zahlenOffen) zahlenErsetzen(vorher);
    var ph = platzhalter(key, ort);
    t.value = ''; t.placeholder = ph;
    var w = t.parentNode; w.classList.add('leer'); w.setAttribute('data-wert', ph);
    if (ort !== 'schritt') zeile.remove();
    if (flug) S.unterwegs.add(e);
    geaendert();
    if (flug) abflug(key, e, neu);
    if (fokusNeu && ort === 'schritt') t.focus();
  }
  function entfernen(key, i, fokus) {
    var e = S[key][i];
    S[key].splice(i, 1);
    abbrechen(e);
    if (key === 'merken') { S.zahlenOffen = -1; S.beruhigt = -1; }
    S.hervor = null;
    neuZeichnen(key, fokus);
    geaendert();
  }
  function aufraeumen() {
    KEYS.forEach(function (k) {
      var t = $(k + '-neu'); if (t && t.value.trim()) uebernehmen(k, false);
      S[k] = S[k].filter(function (e) { return e.text.trim(); });
    });
    S.zahlenOffen = -1; S.beruhigt = -1; S.hervor = null;
  }
  function geh(nach) { aufraeumen(); S.schritt = nach; S.abgegeben = false; render(); window.scrollTo(0, 0); }

  main.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'f-zielgruppe' && t.isContentEditable) { S.zielgruppe = t.textContent; nochLeer(); zgEinpassen(); return; }
    if (t.tagName !== 'TEXTAREA') return;
    var w = t.parentNode;
    w.setAttribute('data-wert', t.value || t.placeholder);
    w.classList.toggle('leer', !t.value);
    if (t.id === 'f-name') S.name = t.value;
    else if (t.id === 'f-zielgruppe') { S.zielgruppe = t.value; zeichne(); nochLeer(); }
    else {
      var key = listeVon(t), zeile = t.closest('.eintrag');
      if (key && !zeile.classList.contains('neu')) { S[key][+zeile.getAttribute('data-i')].text = t.value; zeichne(); }
    }
  });

  main.addEventListener('keydown', function (ev) {
    var t = ev.target;

    if (t.id === 'f-zielgruppe' && t.isContentEditable) { if (ev.key === 'Enter') { ev.preventDefault(); t.blur(); } return; }
    if (t.tagName !== 'TEXTAREA') return;
    var key = listeVon(t), zeile = t.closest('.eintrag');
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      if (!key) {
        if (t.id === 'f-name' && S.schritt === 1) $('f-zielgruppe').focus();
        else if (t.id === 'f-zielgruppe' && S.schritt === 1) $('einsatz-neu').focus();
        else t.blur();
        return;
      }
      if (zeile.classList.contains('neu')) { uebernehmen(key, true); return; }
      var naechste = zeile.nextElementSibling && zeile.nextElementSibling.querySelector('textarea');
      if (naechste) naechste.focus();
    } else if (ev.key === 'Backspace' && key && !t.value && !zeile.classList.contains('neu')) {
      ev.preventDefault();
      var i = +zeile.getAttribute('data-i');
      entfernen(key, i, i > 0 ? i - 1 : 'neu');
    }
  });

  main.addEventListener('mousedown', function (ev) { if (ev.target.closest('button[data-geh], #abschicken')) ev.preventDefault(); });

  main.addEventListener('focusout', function (ev) {
    var t = ev.target;

    if (!umbau && S.zahlenOffen >= 0 && !zeigerUnten && gehoertZurAuswahl(t) && !gehoertZurAuswahl(ev.relatedTarget)) zahlenZu();
    if (t.id === 'f-zielgruppe' && t.isContentEditable) { if (!t.textContent.trim()) { t.textContent = ''; S.zielgruppe = ''; zgEinpassen(); } return; }
    if (t.tagName !== 'TEXTAREA') return;
    var key = listeVon(t); if (!key) return;
    var zeile = t.closest('.eintrag');
    if (zeile.classList.contains('neu')) { uebernehmen(key, false); return; }
    var l = t.closest('.liste');
    if (!t.value.trim() && !(ev.relatedTarget && l.contains(ev.relatedTarget))) entfernen(key, +zeile.getAttribute('data-i'));
  });

  function hervor(el) {
    var h = null;
    var z = el && el.closest && el.closest('.eintrag:not(.neu)');
    if (z) { var key = listeVon(z); if (key) h = { i: KEYS.indexOf(key), j: +z.getAttribute('data-i') }; }
    else { var a = el && el.closest && el.closest('.abschnitt'); if (a) h = { i: +a.getAttribute('data-bogen'), j: -1 }; }
    setzeHervor(h);
  }
  function setzeHervor(h) {
    var alt = S.hervor;
    if ((alt && h && alt.i === h.i && alt.j === h.j && !alt.ring === !h.ring) || (!alt && !h)) return;
    S.hervor = h;

    Array.prototype.forEach.call(main.querySelectorAll('.abschnitt'), function (a) { a.classList.toggle('blass', !!(h && h.ring) && +a.getAttribute('data-bogen') !== h.i); });
    zeichne();
  }
  function imUebersichtsRing(el) { return ansicht() === 'ueber' && !!fig && fig.host.contains(el); }

  main.addEventListener('pointerover', function (ev) { if (!imUebersichtsRing(ev.target)) hervor(ev.target); });

  main.addEventListener('pointermove', function (ev) {
    if (!imUebersichtsRing(ev.target)) return;
    var r = fig.host.getBoundingClientRect(), dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
    var naeh = Math.abs(Math.hypot(dx, dy) - r.width * R / 460) < 30;
    setzeHervor(naeh ? { i: Math.floor(((Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360) / 90), j: -1, ring: true } : null);
  });
  main.addEventListener('pointerleave', function () { hervor(document.activeElement); });
  main.addEventListener('focusin', function (ev) { hervor(ev.target); });

  main.addEventListener('change', function (ev) {
    var t = ev.target; if (t.type !== 'radio') return;
    var i = +t.getAttribute('data-i');
    S.merken[i].zahlen = t.value;
    if (pfeil) return;
    S.beruhigt = t.value === 'nein' ? i : -1;
    zahlenZu(!zeigerUnten);
  });

  main.addEventListener('click', function (ev) {
    if (ev.target.closest('.zg-block .fuer')) { var zt = $('f-zielgruppe'); if (zt) zt.focus(); return; }
    var b = ev.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-weg')) {
      var key = listeVon(b), i = +b.getAttribute('data-weg');
      entfernen(key, i, i < S[key].length - 1 ? i : 'neu');
      return;
    }
    if (b.hasAttribute('data-stand')) {
      var j = +b.getAttribute('data-stand');
      ev.zahlenErledigt = true;
      zahlenAuf(j);
      var zeile = zahlenZeile(j), z = zeile && (zeile.querySelector('input:checked') || zeile.querySelector('input'));
      if (z) z.focus();
      return;
    }
    if (b.hasAttribute('data-geh')) { geh(+b.getAttribute('data-geh')); return; }
    if (b.id === 'abschicken') { aufraeumen(); S.abgegeben = true; render(); window.scrollTo(0, 0); return; }
    if (b.id === 'nochmal') { S.abgegeben = false; S.schritt = 5; render(); return; }
    if (b.id === 'datei') alsDatei();
  });

  var umbruch;
  window.addEventListener('resize', function () { clearTimeout(umbruch); umbruch = setTimeout(function () { zeichne(); zgEinpassen(); }, 120); });

  function alsDatei() {
    aufraeumen();
    var z = ['Vorarbeit für die ' + WW, '', 'Vorhaben: ' + (S.name || 'noch ohne Namen'), 'für: ' + (S.zielgruppe || 'noch offen'), ''];
    KEYS.forEach(function (k, i) {
      z.push(WORTE[i] + ':');
      if (!S[k].length) z.push('  noch nichts eingetragen');
      S[k].forEach(function (e) { z.push('  · ' + e.text + (k === 'merken' ? ' (' + STAND[e.zahlen || ''].replace('?', ': offen') + ')' : '')); });
      z.push('');
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([z.join('\n')], { type: 'text/plain;charset=utf-8' }));
    a.download = 'Vorarbeit ' + (S.name || 'Vorhaben').replace(/[\\/:*?"<>|]/g, '') + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
  }

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { zeichne(); zgEinpassen(); });
})();
</script>
